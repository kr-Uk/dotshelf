# ---------- Cloudflare-only allowlist ----------
# 서버 블록의 `if ($is_from_cf = 0) { return 444; }` 와 짝지어, 도메인 매치된 트래픽이
# Cloudflare 엣지를 거치지 않고 origin 직타로 들어오는 경우 connection close.
#
# - $realip_remote_addr 는 set_real_ip_from(CF-Connecting-IP) 변환 *이전* 의 원래 connect IP.
#   set_real_ip_from(default.conf) 와 동일한 CF 대역을 여기에 둬야 의미가 일치한다.
# - Tailscale 100.64.0.0/10: 서버간 헬스체크/내부 호출 (prod ↔ app)
# - Localhost: 컨테이너/cron 헬스 프로브
#
# CF IP 출처: https://www.cloudflare.com/ips-v4 / ips-v6 (default.conf 의 set_real_ip_from 와 동일)

geo $realip_remote_addr $is_from_cf {
    default 0;

    # Cloudflare IPv4
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    # Cloudflare IPv6
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;

    # Tailscale (서버간 헬스체크/내부 호출)
    100.64.0.0/10 1;

    # Docker bridge networks (host -> 컨테이너 publish 포트는 docker-proxy SNAT 으로
    # docker bridge gateway IP 가 source 가 됨. RFC 1918 private 라 외부에서 들어올 수
    # 없는 대역이므로 통째로 허용해도 안전).
    172.16.0.0/12 1;

    # Localhost
    127.0.0.1/32 1;
    ::1/128 1;
}
