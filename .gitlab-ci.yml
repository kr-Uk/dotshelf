stages:
  - build
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  JAR_ARTIFACT_PATH: backend/build/libs
  UNITY_VERSION: "6000.3.13f1"
  UNITY_PROJECT_PATH: "$CI_PROJECT_DIR/frontend"
  UNITY_EXECUTABLE: "/opt/unity/Editor/Unity"

# 브랜치 전략 (2026-04-30~):
# - dev    → test 환경 (dev-api.dotshelf.digital, dev.dotshelf.digital) + admin-web prod
# - master → prod (api.dotshelf.digital, dotshelf.digital) — v1 출시 시점에 dev → master 머지
# admin-web 만 dev=prod 단일 스테이지 유지 (운영자 백오피스, 변경 빈도 낮음).
#
# test 도메인이 'dev-api' (대시) 인 이유: Cloudflare Universal SSL 의 wildcard *.dotshelf.digital
# 가 1단계 서브도메인만 커버 — 2단계 (dev.api.*) 쓰려면 ACM 월 $10 필요. 무료로 운영.

.backend-rules:
  # build: dev/master 어느 쪽이든 backend 변경되면 돈다 (test/prod 잡 모두 산출물 필요).
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .ci/**/*
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .ci/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .ci/**/*

.deploy-rules:
  # backend prod 배포: master 트리거만.
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .ci/**/*

.backend-test-rules:
  # backend test 배포: dev 트리거만.
  # docker-compose.test.yml / nginx dev.* vhost 변경도 트리거에 포함.
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .ci/**/*
        - backend/deploy/app/docker-compose.test.yml
        - backend/deploy/prod/nginx/conf.d/**/*

.service-web-rules:
  # service-web prod 배포: 출시 전 단계라 dev=prod 단일 스테이지 (admin-web 패턴과 동일).
  # master 트리거 휴면이라 dev 머지 한 번으로 dotshelf.digital 까지 도달해야 banner linkUrl
  # 의 prod URL 들 (/changelog/X, /events/X) 이 살아남는다. v1.0 출시 시점에 master 트리거
  # 활성화하면서 다시 master 전용으로 좁힐 예정.
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - web/service-web/**/*
        - .gitlab-ci.yml
        - .ci/**/*
        # service 컨테이너 정의(compose) 또는 root vhost(nginx) 만 변경된 경우에도
        # service-web:deploy 가 돌아 컨테이너 재빌드/기동까지 가도록 rule 에 포함.
        - backend/deploy/app/docker-compose.yml
        - backend/deploy/prod/nginx/conf.d/**/*
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - web/service-web/**/*
        - .gitlab-ci.yml
        - .ci/**/*
        - backend/deploy/app/docker-compose.yml
        - backend/deploy/prod/nginx/conf.d/**/*

.service-web-test-rules:
  # service-web test 배포: dev 트리거만.
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - web/service-web/**/*
        - .gitlab-ci.yml
        - .ci/**/*
        - backend/deploy/app/docker-compose.test.yml
        - backend/deploy/prod/nginx/conf.d/**/*

.admin-web-rules:
  # admin-web 은 dev=prod 단일 스테이지 (test 환경 없음). 운영자 백오피스로 변경 빈도 낮음.
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - web/admin-web/**/*
        - .gitlab-ci.yml
        - .ci/**/*
        # admin 컨테이너 정의(compose) 또는 nginx conf.d 의 어떤 파일이든 변경되면
        # admin-web:deploy 가 돌도록 — admin-vhost.conf 와 00-cf-allowlist.conf 같은
        # 전역 의존 파일도 자기 잡이 보내야 source-of-truth 동기화 보장.
        - backend/deploy/app/docker-compose.yml
        - backend/deploy/prod/nginx/conf.d/**/*

.service-web-build-rules:
  # service-web 빌드 검증 (tsc + eslint + next build). MR 이벤트 + dev/master 푸시에서
  # web/service-web/**/* 변경 시 가동. MR #150 리뷰 응답으로 신규 — 이전엔 launcher:build
  # 만 잡혔고 service-web 코드 변경이 MR pipeline gate 를 통과 못 했음 (Finding 2/3).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - web/service-web/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - web/service-web/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - web/service-web/**/*
        - .gitlab-ci.yml

.launcher-build-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - launcher/**/*
        - web/service-web/app/(marketing)/download/page.tsx
        # nginx conf.d 의 어떤 파일이든 변경되면 launcher:publish 가 돌아야 하므로
        # build 도 같이 돌아야 함 (publish 가 build artifact 를 needs 로 요구).
        # launcher-publish-rules 와 동일 범위로 통일.
        - backend/deploy/prod/nginx/conf.d/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - launcher/**/*
        - web/service-web/app/(marketing)/download/page.tsx
        - backend/deploy/prod/nginx/conf.d/**/*
        - .gitlab-ci.yml

# 출시 전: dev 가 사실상 메인이라 dev 머지 시 prod 배포까지 진행.
# 출시 후 master 가 실제 prod 분기로 활성화되면 같은 룰이 master 에서도 그대로 동작.
.launcher-publish-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - launcher/**/*
        - web/service-web/app/(marketing)/download/page.tsx
        - backend/deploy/prod/nginx/conf.d/**/*
        - .gitlab-ci.yml

cache:
  key:
    files:
      - backend/build.gradle.kts
      - backend/settings.gradle.kts
  paths:
    - backend/.gradle/caches
    - backend/.gradle/wrapper

backend:build:
  extends: .backend-rules
  stage: build
  image: eclipse-temurin:21-jdk
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  before_script:
    - cd backend
    - chmod +x ./gradlew
  script:
    - ./gradlew check bootJar -DrunPostgresTests=true --no-daemon
  artifacts:
    name: "dotshelf-api-$CI_COMMIT_SHORT_SHA"
    paths:
      - $JAR_ARTIFACT_PATH/*-SNAPSHOT.jar
      - backend/build/reports/tests/test
      - backend/build/reports/jacoco/test
      - backend/build/reports/problems
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    when: always
    expire_in: 1 week

frontend:unity-compile:
  stage: build
  # Current shared Docker runner is arm64, while Unity editor containers are amd64-only.
  # Keep this job disabled until an amd64 Unity runner is available.
  # Set the project/group CI/CD variable UNITY_COMPILE_ENABLED=true to enable it; failures should then block the MR.
  rules:
    - if: '$UNITY_COMPILE_ENABLED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - when: never
  image:
    name: unityci/editor:ubuntu-$UNITY_VERSION-base-3
    docker:
      platform: linux/amd64
  before_script:
    - |
      test -n "$UNITY_LICENSE" || {
        echo "UNITY_LICENSE CI variable is required for Unity compile check."
        exit 1
      }
    - printf '%s' "$UNITY_LICENSE" > /tmp/unity-license.ulf
  script:
    - |
      "$UNITY_EXECUTABLE" -batchmode -nographics -manualLicenseFile /tmp/unity-license.ulf -logFile /tmp/unity-license.log || {
        cat /tmp/unity-license.log
        exit 1
      }
    - |
      "$UNITY_EXECUTABLE" -batchmode -nographics -quit -projectPath "$UNITY_PROJECT_PATH" -executeMethod BookshelfPorting.Editor.Ci.UnityCompileCheck.Run -logFile "$UNITY_PROJECT_PATH/unity-compile.log"
  after_script:
    - test -f frontend/unity-compile.log || touch frontend/unity-compile.log
    - tail -n 200 frontend/unity-compile.log || true
  artifacts:
    name: "dotshelf-unity-compile-$CI_COMMIT_SHORT_SHA"
    paths:
      - frontend/unity-compile.log
    when: always
    expire_in: 1 week

launcher:build:
  extends: .launcher-build-rules
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - LAUNCHER_VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' launcher/src/DotShelf.Launcher/DotShelf.Launcher.csproj | head -n 1)
    - dotnet publish launcher/src/DotShelf.Launcher/DotShelf.Launcher.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o launcher/dist/win-x64
    - mkdir -p launcher/release/windows
    - cp launcher/dist/win-x64/DotShelfLauncher.exe "launcher/release/windows/DotShelfLauncher-$LAUNCHER_VERSION.exe"
  artifacts:
    name: "dotshelf-launcher-$CI_COMMIT_SHORT_SHA"
    paths:
      - launcher/release/windows/DotShelfLauncher-*.exe
      - launcher/manifests/dev/windows/latest.json
      - launcher/manifests/dev/windows/events.json
    expire_in: 1 week

service-web:build:
  # MR/푸시 gate — tsc + eslint + next build. 배포 잡 (service-web:deploy /
  # service-web:test-deploy) 는 호스트에서 docker compose build 로 재빌드하므로
  # 여기서 만든 .next 산출물은 사용 안 함. 순수 검증용.
  extends: .service-web-build-rules
  stage: build
  image: node:22-alpine
  before_script:
    - cd web/service-web
  script:
    - npm ci --no-audit --no-fund
    - npx tsc --noEmit
    - npm run lint
    - npm run build

backend:deploy:
  extends: .deploy-rules
  stage: deploy
  image: alpine:3.20
  needs:
    - job: backend:build
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync curl bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - JAR=$(ls $JAR_ARTIFACT_PATH/*-SNAPSHOT.jar | head -1)
    - APP_COMPOSE=backend/deploy/app/docker-compose.yml
    - APP_PROMTAIL=backend/deploy/app/promtail
    - DOCKERFILE=backend/Dockerfile
    - NGINX_CONFD=backend/deploy/prod/nginx/conf.d
    - echo "Staging payloads to app=$EC2_HOST prod=$PROD_HOST"
    # --- Stage JAR + Dockerfile + compose + promtail config to app ---
    - ssh "$EC2_USER@$EC2_HOST" "mkdir -p $EC2_DEPLOY_PATH/api/build/libs $EC2_DEPLOY_PATH/promtail && rm -f $EC2_DEPLOY_PATH/api/build/libs/*.jar"
    - rsync -az "$JAR" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/api/build/libs/"
    - rsync -az "$DOCKERFILE" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/api/Dockerfile"
    - rsync -az "$APP_COMPOSE" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/docker-compose.yml"
    - ssh "$EC2_USER@$EC2_HOST" "chmod 640 $EC2_DEPLOY_PATH/docker-compose.yml"
    - rsync -az --delete "$APP_PROMTAIL/" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/promtail/"
    # --- Stage Nginx configs to prod ---
    # 파일별로 분리 rsync (master 잡은 default.conf + blue-green templates/ 만 — admin-vhost.conf
    # / dev-vhosts.conf 는 각자 잡이 담당). 디렉터리 통째로 보내면 dev 브랜치에서 다른 vhost 를
    # 건드린 게 master 머지 전에 prod 로 새어나가므로 격리.
    # 00-cf-allowlist.conf 는 모든 vhost 의 $is_from_cf 의존이라 nginx 를 reload 하는
    # 모든 잡이 vhost 파일보다 먼저 보내야 한다 (bootstrapping 안전 + 후속 allowlist-only
    # 변경에서 어느 잡이 먼저 돌든 nginx -t 통과 보장).
    - ssh "$PROD_USER@$PROD_HOST" "mkdir -p $PROD_DEPLOY_PATH/nginx/conf.d"
    - rsync -az "$NGINX_CONFD/00-cf-allowlist.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/00-cf-allowlist.conf"
    - rsync -az "$NGINX_CONFD/default.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/default.conf"
    - rsync -az --delete --exclude='upstream.active.conf' --exclude='*.bak*' "$NGINX_CONFD/templates/" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/templates/"
    # --- Blue-Green orchestration ---
    - sh .ci/deploy-blue-green.sh
    # --- Evidence: 30s post-cutover polling (informational, non-blocking) ---
    - sh .ci/poll-health.sh "https://api.dotshelf.digital/health" 30 || echo "⚠️ 배포 후 30초 폴링에서 실패 감지"
  environment:
    name: backend-prod
    url: https://api.dotshelf.digital

service-web:deploy:
  extends: .service-web-rules
  stage: deploy
  image: alpine:3.20
  # needs 부재 — 이전엔 launcher:publish 가 LAUNCHER_WIN_URL 의 새 .exe hash 를 R2 에
  # 먼저 올린 뒤 service-web 가 그 hash 가리키도록 ordering 했지만, 본 MR (#155) 부터는
  # launcher:publish 가 events.json publish 전에 service-web:deploy 끝나길 기다리는
  # 역방향 의존이 critical (events banner linkUrl 의 prod URL 200 보장) — 양쪽 의존
  # 동시 유지 시 circular. download race 는 .exe upload 가 30초로 짧고 retention 으로
  # 옛 hash 가 R2 에 살아있어 mitigation 가능, events race 는 service-web build 가
  # 2~5분 으로 길어 사용자 영향 더 큼. 따라서 events 방향만 유지.
  before_script:
    - apk add --no-cache openssh-client rsync curl bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - APP_COMPOSE=backend/deploy/app/docker-compose.yml
    - NGINX_CONFD=backend/deploy/prod/nginx/conf.d
    - SERVICE_WEB_TARGET=$EC2_DEPLOY_PATH/service-web
    - echo "Deploying service-web to app=$EC2_HOST, nginx config to prod=$PROD_HOST"
    # --- Stage Next 소스 to SSAFY (node_modules/.next 는 .dockerignore + rsync exclude 로 제외) ---
    - ssh "$EC2_USER@$EC2_HOST" "mkdir -p $SERVICE_WEB_TARGET"
    - rsync -az --delete --exclude=node_modules --exclude=.next --exclude=.git "web/service-web/" "$EC2_USER@$EC2_HOST:$SERVICE_WEB_TARGET/"
    # --- compose.yml 도 함께 갱신(서비스 정의 변경분 반영) ---
    - rsync -az "$APP_COMPOSE" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/docker-compose.yml"
    - ssh "$EC2_USER@$EC2_HOST" "chmod 640 $EC2_DEPLOY_PATH/docker-compose.yml"
    # --- Stage Nginx config to prod (root vhost 의 service-web 프록시 전환 반영) ---
    # default.conf 만 보냄 — admin-vhost.conf / dev-vhosts.conf 는 각자 담당 잡 (admin-web:deploy
    # / *:test-deploy) 이 보냄. master 잡이 다른 vhost 를 건드리지 않게 격리.
    # 00-cf-allowlist.conf 는 default.conf 의 $is_from_cf 가드 의존이라 같이 동기화 (위
    # backend:deploy 와 동일 이유).
    - ssh "$PROD_USER@$PROD_HOST" "mkdir -p $PROD_DEPLOY_PATH/nginx/conf.d"
    - rsync -az "$NGINX_CONFD/00-cf-allowlist.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/00-cf-allowlist.conf"
    - rsync -az "$NGINX_CONFD/default.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/default.conf"
    # --- 컨테이너 재빌드 + 기동 (호스트에서 amd64 네이티브 빌드) ---
    - ssh "$EC2_USER@$EC2_HOST" "cd $EC2_DEPLOY_PATH && docker compose up -d --build service-web && docker image prune -f"
    # --- prod Nginx reload (config 만 바뀐 경우엔 reload 만으로 충분) ---
    - ssh "$PROD_USER@$PROD_HOST" "sudo docker exec dotshelf-nginx nginx -t && sudo docker exec dotshelf-nginx nginx -s reload"
    # --- Health 검증: 컨테이너 직접 + Cloudflare 경유 ---
    - ssh "$EC2_USER@$EC2_HOST" "curl -fsS http://100.74.2.103:3002/ -o /dev/null"
    - curl -fsS https://dotshelf.digital/health -o /dev/null
    - curl -fsS https://dotshelf.digital/ -o /dev/null
  environment:
    name: service-web-prod
    url: https://dotshelf.digital

launcher:publish:
  extends: .launcher-publish-rules
  stage: deploy
  image: alpine:3.20
  needs:
    - job: launcher:build
      artifacts: true
    # events.json 의 banner linkUrl 이 가리키는 prod 페이지 (/changelog/*, /events/*) 가
    # 사용자 R2 cache TTL 안에 도달하지 못하면 사용자가 banner 클릭 → 404 회귀 (MR #155
    # 리뷰 must-fix #1). service-web:deploy 가 끝난 뒤 events.json 을 R2 publish 해서
    # 사용자가 새 banner 받는 시점엔 prod 페이지가 이미 존재하도록 sequence 보장.
    # optional:true — service-web 변경 없는 launcher 전용 머지에서 service-web:deploy
    # 가 트리거 안 돼도 launcher:publish 는 그대로 진행.
    - job: service-web:deploy
      optional: true
  before_script:
    # coreutils: Alpine busybox 의 sort 는 -V (version sort) 미지원, head 도 -n -K 미지원.
    # R2 cleanup 단계의 SemVer 정렬 + "최근 3개 빼고" 슬라이스에 GNU sort/head 필요.
    - apk add --no-cache openssh-client rsync curl jq aws-cli coreutils
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - MANIFEST=launcher/manifests/dev/windows/latest.json
    - EVENTS=launcher/manifests/dev/windows/events.json
    - NGINX_CONFD=backend/deploy/prod/nginx/conf.d
    - LAUNCHER_VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' launcher/src/DotShelf.Launcher/DotShelf.Launcher.csproj | head -n 1)
    - PACKAGE_URL=$(jq -r '.packageUrl' "$MANIFEST")
    - PACKAGE_FILE=$(basename "$PACKAGE_URL")
    - UNITY_VERSION=$(jq -r '.latestVersion' "$MANIFEST")
    - EXPECTED_SHA=$(jq -r '.sha256' "$MANIFEST" | tr '[:lower:]' '[:upper:]')
    # Unity zip 출처: 같은 프로젝트의 GitLab Generic Packages (dotshelf-unity 패키지).
    # 사람이 Unity Editor 로 빌드한 뒤 PRIVATE-TOKEN PUT 으로 업로드해 둔 산출물.
    # CI 에서는 JOB-TOKEN 으로 같은 프로젝트 패키지를 인증해 받는다.
    - curl -fL --header "JOB-TOKEN:$CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/dotshelf-unity/$UNITY_VERSION/$PACKAGE_FILE" -o "$PACKAGE_FILE"
    - ACTUAL_SHA=$(sha256sum "$PACKAGE_FILE" | awk '{print toupper($1)}')
    - test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Unity zip sha256 mismatch (manifest=$EXPECTED_SHA actual=$ACTUAL_SHA)"; exit 1; }
    # --- R2 업로드 (런처 산출물은 cdn.dotshelf.digital 만 서빙) ---
    # --cache-control 명시: manifest 는 짧게(60s) — 새 버전 보급 지연 방지.
    # 바이너리는 versioned filename 이라 immutable 30d — CDN/client 캐시 최대 활용.
    - export AWS_ACCESS_KEY_ID="$R2_LAUNCHER_ACCESS_KEY_ID"
    - export AWS_SECRET_ACCESS_KEY="$R2_LAUNCHER_SECRET_ACCESS_KEY"
    - export AWS_DEFAULT_REGION=auto
    - aws --endpoint-url "$R2_LAUNCHER_ENDPOINT" s3 cp "launcher/release/windows/DotShelfLauncher-$LAUNCHER_VERSION.exe" "s3://$R2_LAUNCHER_BUCKET/windows/DotShelfLauncher-$LAUNCHER_VERSION.exe" --cache-control "public, max-age=2592000, immutable"
    - aws --endpoint-url "$R2_LAUNCHER_ENDPOINT" s3 cp "$PACKAGE_FILE" "s3://$R2_LAUNCHER_BUCKET/windows/$PACKAGE_FILE" --cache-control "public, max-age=2592000, immutable"
    - aws --endpoint-url "$R2_LAUNCHER_ENDPOINT" s3 cp "$MANIFEST" "s3://$R2_LAUNCHER_BUCKET/windows/latest.json" --content-type application/json --cache-control "public, max-age=60"
    - aws --endpoint-url "$R2_LAUNCHER_ENDPOINT" s3 cp "$EVENTS" "s3://$R2_LAUNCHER_BUCKET/windows/events.json" --content-type application/json --cache-control "public, max-age=60"
    # --- nginx redirect config 동기화 (기존 0.1.0 런처가 dotshelf.digital 로 폴링 → 301 → cdn) ---
    - ssh "$PROD_USER@$PROD_HOST" "mkdir -p $PROD_DEPLOY_PATH/nginx/conf.d"
    # 00-cf-allowlist.conf 는 default.conf 의 $is_from_cf 가드 의존이라 같이 동기화.
    - rsync -az "$NGINX_CONFD/00-cf-allowlist.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/00-cf-allowlist.conf"
    - rsync -az "$NGINX_CONFD/default.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/default.conf"
    - ssh "$PROD_USER@$PROD_HOST" "sudo docker exec dotshelf-nginx nginx -t && sudo docker exec dotshelf-nginx nginx -s reload"
    # --- 검증: R2 직접 hit + EC2 redirect 따라가서 GET + JSON 파싱까지 확인 ---
    - curl -fI "$R2_LAUNCHER_PUBLIC_BASE_URL/windows/DotShelfLauncher-$LAUNCHER_VERSION.exe"
    - curl -fI "$R2_LAUNCHER_PUBLIC_BASE_URL/windows/latest.json"
    - curl -fI "$R2_LAUNCHER_PUBLIC_BASE_URL/windows/events.json"
    - curl -fI "$PACKAGE_URL"
    # GET 으로 받아서 jq 파싱 → 실제 사용자(.NET HttpClient) 흐름과 동일하게 검증.
    - curl -fL --max-redirs 5 "https://dotshelf.digital/launcher/windows/latest.json" -o /tmp/redirected-latest.json
    - jq -e '.packageUrl, .latestVersion, .sha256' /tmp/redirected-latest.json > /dev/null
    - curl -fL --max-redirs 5 "https://dotshelf.digital/launcher/windows/events.json" -o /tmp/redirected-events.json
    - jq -e '.' /tmp/redirected-events.json > /dev/null
    # --- R2 retention: 최근 3개 버전만 유지 ---
    # 새 빌드가 위에서 이미 업로드된 후 호출되므로 "현재 + 직전 2개" 가 살아남는다.
    # 동일 버전 재배포 (idempotent overwrite) 에선 삭제 대상 없음.
    #
    # 안전망 (MR #148 리뷰 응답):
    # 1. GNU sort 우선 확인 — busybox 가 PATH 앞쪽이면 'sort -V' silent 실패 위험.
    #    coreutils apk add 했어도 PATH 순서가 다른 환경에서 회귀 방지.
    # 2. SemVer 파일명만 grep — 임시 / .sha256 / .json / 공백 포함 파일이
    #    같은 prefix 로 우연히 들어와도 정렬/삭제 대상에서 제외. manifest 보호.
    # 3. cleanup 대상을 명시 로그 — silent 삭제 0건 vs 의도된 retention 구분 가능,
    #    첫 사이클에서 cleanup 의도 확인 친화.
    - |
      # GNU sort / head 동작 직접 검증. 'sort --version | grep GNU' 식 출력 매치는
      # PATH / busybox alias / coreutils 패키지 변형에 따라 false negative 발생 (MR #150
      # 머지 후 CI fail — busybox sort 가 --version 출력 안 함 → grep 0건 → exit).
      # 실제로 SemVer 정렬과 negative head 가 동작하는지 동작 자체로 판정 — 환경 가정 0.
      SORT_TEST=$(printf "0.1.0\n0.1.10\n0.1.2\n" | sort -V 2>/dev/null | tr '\n' ' ')
      if [ "$SORT_TEST" != "0.1.0 0.1.2 0.1.10 " ]; then
        echo "ERROR: 'sort -V' 가 SemVer 정렬을 못 합니다 (busybox 가 PATH 우선?)."
        echo "  expected: '0.1.0 0.1.2 0.1.10 '"
        echo "  got:      '$SORT_TEST'"
        echo "  PATH=$PATH"
        echo "  which sort: $(command -v sort)"
        echo "  /usr/bin/sort 직접 시도:"
        printf "0.1.0\n0.1.10\n0.1.2\n" | /usr/bin/sort -V 2>&1 || true
        exit 1
      fi
      HEAD_TEST=$(printf "1\n2\n3\n4\n5\n" | head -n -2 2>/dev/null | tr '\n' ' ')
      if [ "$HEAD_TEST" != "1 2 3 " ]; then
        echo "ERROR: 'head -n -K' 가 동작 안 합니다 (busybox head 일 가능성)."
        echo "  expected: '1 2 3 '"
        echo "  got:      '$HEAD_TEST'"
        exit 1
      fi
      cleanup_r2() {
        prefix="$1"
        base="${prefix##*/}"
        # SemVer 파일명만 매치 — '^<base><x.y.z>\.(exe|zip)$'. manifest (.json) 절대 매치 안 됨.
        aws --endpoint-url "$R2_LAUNCHER_ENDPOINT" s3 ls "s3://$R2_LAUNCHER_BUCKET/$prefix" \
          | awk '{print $NF}' \
          | grep -E "^${base}[0-9]+\\.[0-9]+\\.[0-9]+\\.(exe|zip)$" \
          | sort -V > /tmp/retention-all.txt || true
        echo "  [retention] '$prefix' SemVer 후보:"
        sed 's/^/    /' /tmp/retention-all.txt
        head -n -3 /tmp/retention-all.txt > /tmp/retention-rm.txt || true
        if [ -s /tmp/retention-rm.txt ]; then
          echo "  [retention] 상위 3개 유지, 나머지 삭제:"
          while read -r f; do
            [ -z "$f" ] && continue
            echo "    - s3://$R2_LAUNCHER_BUCKET/windows/$f"
            aws --endpoint-url "$R2_LAUNCHER_ENDPOINT" s3 rm "s3://$R2_LAUNCHER_BUCKET/windows/$f"
          done < /tmp/retention-rm.txt
        else
          echo "  [retention] 보관 3개 이하 — 삭제 대상 없음"
        fi
      }
      cleanup_r2 "windows/DotShelfLauncher-"
      cleanup_r2 "windows/Dotshelf-"
  environment:
    name: launcher-prod
    url: https://cdn.dotshelf.digital/windows/latest.json

admin-web:deploy:
  extends: .admin-web-rules
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync curl bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - APP_COMPOSE=backend/deploy/app/docker-compose.yml
    - NGINX_CONFD=backend/deploy/prod/nginx/conf.d
    - ADMIN_WEB_TARGET=$EC2_DEPLOY_PATH/admin-web
    - echo "Deploying admin-web to app=$EC2_HOST, nginx config to prod=$PROD_HOST"
    # --- Stage Next 소스 to SSAFY ---
    - ssh "$EC2_USER@$EC2_HOST" "mkdir -p $ADMIN_WEB_TARGET"
    - rsync -az --delete --exclude=node_modules --exclude=.next --exclude=.git "web/admin-web/" "$EC2_USER@$EC2_HOST:$ADMIN_WEB_TARGET/"
    - rsync -az "$APP_COMPOSE" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/docker-compose.yml"
    - ssh "$EC2_USER@$EC2_HOST" "chmod 640 $EC2_DEPLOY_PATH/docker-compose.yml"
    # --- Stage Nginx config to prod (admin-vhost.conf 만 — 다른 prod vhost 미영향) ---
    # admin-web 은 dev=prod 단일 스테이지라 dev 트리거가 admin vhost 만 갱신하고 default.conf
    # (api/service-web/grafana) 는 안 건드리도록 자기 파일만 보냄.
    # 00-cf-allowlist.conf 는 admin-vhost.conf 의 $is_from_cf 가드 의존이라 같이 동기화 —
    # 다른 deploy 잡들 (backend / service-web / *:test-deploy / launcher:publish) 도 각자
    # 같은 패턴으로 00-cf-allowlist.conf 를 먼저 보낸 뒤 자기 vhost 파일을 보낸다.
    # 한 잡에 의존시키면 admin-web:deploy 가 fail / skip 되거나 다른 잡이 먼저 돌면
    # nginx -t 가 unknown variable 로 실패할 수 있으므로 모든 잡이 idempotent rsync.
    - ssh "$PROD_USER@$PROD_HOST" "mkdir -p $PROD_DEPLOY_PATH/nginx/conf.d"
    - rsync -az "$NGINX_CONFD/00-cf-allowlist.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/00-cf-allowlist.conf"
    - rsync -az "$NGINX_CONFD/admin-vhost.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/admin-vhost.conf"
    # --- 컨테이너 재빌드 + 기동 ---
    - ssh "$EC2_USER@$EC2_HOST" "cd $EC2_DEPLOY_PATH && docker compose up -d --build admin-web && docker image prune -f"
    - ssh "$PROD_USER@$PROD_HOST" "sudo docker exec dotshelf-nginx nginx -t && sudo docker exec dotshelf-nginx nginx -s reload"
    # --- Health 검증: 컨테이너 직접만(Cloudflare Access 가 공개 URL 을 막아 외부 curl 은 302 로그인 페이지 반환) ---
    - ssh "$EC2_USER@$EC2_HOST" "curl -fsS http://100.74.2.103:3001/ -o /dev/null"
  environment:
    name: admin-web-prod
    url: https://admin.dotshelf.digital

# ==============================================================================
# test 환경 배포 잡 (dev 트리거)
# - test 컨테이너는 prod blue/green 과 별개 디렉터리 / compose / .env 사용
# - blue-green 미적용 — test 환경 다운타임 허용
# - nginx config 는 prod/test 공유 (같은 default.conf), 양쪽 잡 모두 rsync 함 (idempotent)
# ==============================================================================

backend:test-deploy:
  extends: .backend-test-rules
  stage: deploy
  image: alpine:3.20
  needs:
    - job: backend:build
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync curl bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - JAR=$(ls $JAR_ARTIFACT_PATH/*-SNAPSHOT.jar | head -1)
    - APP_COMPOSE_TEST=backend/deploy/app/docker-compose.test.yml
    - DOCKERFILE=backend/Dockerfile
    - NGINX_CONFD=backend/deploy/prod/nginx/conf.d
    - echo "Staging test payloads to app=$EC2_HOST"
    # --- Stage JAR + Dockerfile to api-test 디렉터리 (.env.test 는 서버에 미리 있어야 함) ---
    - ssh "$EC2_USER@$EC2_HOST" "mkdir -p $EC2_DEPLOY_PATH/api-test/build/libs && rm -f $EC2_DEPLOY_PATH/api-test/build/libs/*.jar"
    - rsync -az "$JAR" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/api-test/build/libs/"
    - rsync -az "$DOCKERFILE" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/api-test/Dockerfile"
    - rsync -az "$APP_COMPOSE_TEST" "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/docker-compose.test.yml"
    - ssh "$EC2_USER@$EC2_HOST" "chmod 640 $EC2_DEPLOY_PATH/docker-compose.test.yml"
    # --- Stage Nginx config to prod (dev-vhosts.conf 만 — prod vhost 미영향) ---
    # dev 트리거 잡이 default.conf (prod) 를 보내지 않도록 자기 파일만 rsync. dev 브랜치에서
    # 누가 prod vhost 를 건드려도 master 머지 전엔 prod 라우팅에 영향 가지 않음.
    # 00-cf-allowlist.conf 는 dev-vhosts.conf 의 $is_from_cf 가드 의존이라 같이 동기화 —
    # bootstrapping 시 nginx -t 가 unknown variable 로 실패하는 회귀 차단.
    - ssh "$PROD_USER@$PROD_HOST" "mkdir -p $PROD_DEPLOY_PATH/nginx/conf.d"
    - rsync -az "$NGINX_CONFD/00-cf-allowlist.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/00-cf-allowlist.conf"
    - rsync -az "$NGINX_CONFD/dev-vhosts.conf" "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/nginx/conf.d/dev-vhosts.conf"
    # --- 컨테이너 재빌드 + 기동 (단순 up, blue-green 없음) ---
    - ssh "$EC2_USER@$EC2_HOST" "cd $EC2_DEPLOY_PATH && docker compose --env-file .env.test -f docker-compose.test.yml up -d --build api-test && docker image prune -f"
    # --- prod Nginx reload ---
    - ssh "$PROD_USER@$PROD_HOST" "sudo docker exec dotshelf-nginx nginx -t && sudo docker exec dotshelf-nginx nginx -s reload"
    # --- Health 검증: 컨테이너 부팅 폴링 (Spring Boot 첫 부팅 ~30-50초) ---
    # sleep 10 + curl 한 번으론 첫 부팅 못 따라잡아 connection refused 가 자주 발생 → poll loop.
    # timeout 120s 까지 2초 간격 retry. 제한 도달 시 잡 fail (timeout 명령이 exit 124).
    - ssh "$EC2_USER@$EC2_HOST" "timeout 120 sh -c 'until curl -fsS http://100.74.2.103:9080/health -o /dev/null; do sleep 2; done'"
    - curl -fsS https://dev-api.dotshelf.digital/health -o /dev/null
  environment:
    name: backend-test
    url: https://dev-api.dotshelf.digital

