server:
  port: 8080

spring:
  application:
    name: dotshelf-api

  profiles:
    default: local

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # OAuth2 client: add providers/registrations when needed
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-32bytes-minimum-length}
  access-token-validity-seconds: ${JWT_ACCESS_TTL:1800}
  refresh-token-validity-seconds: ${JWT_REFRESH_TTL:2592000}
  issuer: dotshelf
