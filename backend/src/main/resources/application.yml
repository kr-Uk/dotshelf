server:
  port: 8080

spring:
  application:
    name: dotshelf-api

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]

  profiles:
    default: local

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  # multipart 기본 한도(1MB)는 Unity 자동 캡처 썸네일에는 부족.
  # SpaceService.MAX_THUMBNAIL_SIZE_BYTES(2MB) 와 연동해 약간 여유를 둔다.
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # OAuth2 client: add providers/registrations when needed
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-32bytes-minimum-length}
  access-token-validity-seconds: ${JWT_ACCESS_TTL:1800}
  refresh-token-validity-seconds: ${JWT_REFRESH_TTL:2592000}
  issuer: dotshelf

admin:
  test-auth:
    enabled: ${ADMIN_TEST_AUTH_ENABLED:true}
    header-name: ${ADMIN_TEST_AUTH_HEADER_NAME:X-Test-Admin-User-Id}

social:
  google:
    server-client-id: ${GOOGLE_SERVER_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
    client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Desktop OAuth용 client_id (PKCE 흐름). FE가 authorize 시 사용한 값과 정확히 일치해야 함.
    # 미설정 시 PKCE 흐름은 server-client-id로 시도 (Google이 거절할 수 있음).
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    # Google Desktop app type client는 PKCE 사용해도 client_secret을 형식적으로 요구함
    # (Google 정책 — 공개 secret이지만 token endpoint가 받음). 진짜 보안은 PKCE가 담당.
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}
    issuers:
      - https://accounts.google.com
      - accounts.google.com
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    token-uri: https://oauth2.googleapis.com/token
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    user-info-uri: https://kapi.kakao.com/v2/user/me
    token-uri: https://kauth.kakao.com/oauth/token
  apple:
    client-ids: ${APPLE_CLIENT_IDS:${APPLE_CLIENT_ID:}}
    issuers:
      - https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys

payment:
  inicis:
    mid: ${INICIS_MID:}
    sign-key: ${INICIS_SIGN_KEY:}
    return-url: ${INICIS_RETURN_URL:}
    close-url: ${INICIS_CLOSE_URL:}
    request-script-url: ${INICIS_REQUEST_SCRIPT_URL:https://stdpay.inicis.com/stdjs/INIStdPay.js}

# 이미지/에셋 업로드용 S3 설정. 자격증명은 .env(local) / GitLab Variables(prod) 경유.
# public-base-url 은 CDN(CloudFront) 또는 버킷 public URL — 클라가 GET 으로 보는 호스트.
app:
  storage:
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-northeast-2}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      presign-ttl-seconds: ${S3_PRESIGN_TTL:300}
      presign-bundle-ttl-seconds: ${S3_PRESIGN_BUNDLE_TTL:1800}
