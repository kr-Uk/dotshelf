server:
  port: 8080

spring:
  application:
    name: dotshelf-api

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]

  profiles:
    default: local

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # OAuth2 client: add providers/registrations when needed
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-32bytes-minimum-length}
  access-token-validity-seconds: ${JWT_ACCESS_TTL:1800}
  refresh-token-validity-seconds: ${JWT_REFRESH_TTL:2592000}
  issuer: dotshelf

admin:
  # 테스트 환경에서만 true로 설정한다. true이면 /v1/admin/** 인증/인가를 우회한다.
  auth-bypass: ${ADMIN_AUTH_BYPASS:false}

social:
  google:
    server-client-id: ${GOOGLE_SERVER_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
    client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    issuers:
      - https://accounts.google.com
      - accounts.google.com
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    token-uri: https://oauth2.googleapis.com/token
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    user-info-uri: https://kapi.kakao.com/v2/user/me
    token-uri: https://kauth.kakao.com/oauth/token
  apple:
    client-ids: ${APPLE_CLIENT_IDS:${APPLE_CLIENT_ID:}}
    issuers:
      - https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys
