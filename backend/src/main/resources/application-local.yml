spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dotshelf
    username: dotshelf
    password: dotshelf
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false  # 로컬 dev 에서는 flyway clean 허용

  jpa:
    hibernate:
      # Flyway 가 스키마 소유. 로컬도 프로덕션과 동일한 migration 경로 사용.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
