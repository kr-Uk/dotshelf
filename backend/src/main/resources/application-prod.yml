server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: false
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:dotshelf}
    username: ${DB_USER:dotshelf}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      # Flyway 가 스키마 소유. Hibernate 는 엔티티↔DB 정합성 검증만 수행.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          # 모든 시간 필드는 UTC 로 저장. 표시용 타임존 변환은 클라이언트 책임.
          time_zone: UTC
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s

management:
  endpoints:
    web:
      exposure:
        # prometheus 는 Tailscale 내부에서만 스크레이프. 외부 노출은 Nginx /actuator 차단으로 방지.
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # Blue/Green 구분 라벨. Prometheus 에서 color="blue|green" 으로 쿼리 가능.
      application: dotshelf-api
      color: ${DEPLOY_COLOR:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

logging:
  level:
    root: info
    com.dotshelf: info
    org.hibernate.SQL: warn
    org.springframework.security: warn
