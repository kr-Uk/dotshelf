# Blue-Green 의 `upstream dotshelf_api` 는 nginx.conf 의 `include /etc/nginx/conf.d/*.conf`
# 를 통해 upstream.active.conf 에서 자동 로드된다. 여기서 명시 include 하면 중복 선언으로
# `duplicate upstream` 에러가 나므로 절대 쓰지 말 것. (블루그린 런타임 상태는 templates/
# 아래 블루/그린 파일을 배포 스크립트가 cp 해서 upstream.active.conf 로 승격하는 방식.)

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- root + www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dotshelf.digital www.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/root;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------- api -> Spring Boot (upstream dotshelf_api 는 upstream.active.conf 에서 주입) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # /actuator/* 는 Prometheus 메트릭·헬스·정보 전부 노출되므로 외부 접근 차단.
    # 내부 Prometheus 는 Tailscale 로 컨테이너(8080/8081) 에 직접 접근하므로 영향 없음.
    # 공개 헬스체크는 /health (HealthController) 를 사용한다.
    location /actuator {
        return 404;
    }

    location / {
        proxy_pass http://dotshelf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

# ---------- grafana (공개 차단) ----------
# Grafana 는 공개 HTTPS 엔드포인트를 두지 않고 SSH tunnel 로만 접근한다.
# - Grafana 컨테이너는 여전히 172.17.0.1:3000 (docker bridge) 에 바인딩
# - 접근 방법: `ssh -L 3000:172.17.0.1:3000 dotshelf` → http://localhost:3000
# - 배경: 공개 URL 을 두면 Grafana 로그인 페이지 brute force · CVE 악용 면이 생김
#
# grafana.dotshelf.digital 호스트로 들어오는 요청은 아래 default_server 블록의 444
# (connection close) 로 드롭된다. DNS 레코드는 Cloudflare 에 남아있어도 문제 없음.

# ---------- unknown host ----------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
