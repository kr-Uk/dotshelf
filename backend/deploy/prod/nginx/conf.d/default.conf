real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Blue-Green 의 `upstream dotshelf_api` 는 nginx.conf 의 `include /etc/nginx/conf.d/*.conf`
# 를 통해 upstream.active.conf 에서 자동 로드된다. 여기서 명시 include 하면 중복 선언으로
# `duplicate upstream` 에러가 나므로 절대 쓰지 말 것. (블루그린 런타임 상태는 templates/
# 아래 블루/그린 파일을 배포 스크립트가 cp 해서 upstream.active.conf 로 승격하는 방식.)

# ---------- WebSocket upgrade map (Grafana Live 용) ----------
# 일반 HTTP 요청은 Connection: close, WebSocket 은 Connection: upgrade 로 전달.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # CF-only origin guard — Cloudflare 는 origin 으로 항상 443 (Origin Cert + Full/Strict)
    # 만 사용. 80 은 사용자 브라우저가 잘못 입력한 http://... redirect 용인데, 그것도
    # CF edge 가 redirect 처리하므로 origin 의 80 은 CF 외 출처로만 들어옴 = 직타.
    # 일관성 위해 443 vhost 와 동일하게 444 connection close 로 닫는다.
    if ($is_from_cf = 0) {
        return 444;
    }

    return 301 https://$host$request_uri;
}

# ---------- service-web (공개 랜딩) -> SSAFY:3002 ----------
# Next.js standalone 컨테이너. Tailscale 로 SSAFY app 서버에 접근.
# 이전엔 /usr/share/nginx/html/root 정적 서빙(게임 hub) 이었으나
# 2026-04-29 부로 service-web Next 앱으로 전환.
upstream dotshelf_service {
    server 100.74.2.103:3002;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dotshelf.digital www.dotshelf.digital;

    # CF-only origin guard ($is_from_cf 는 00-cf-allowlist.conf 에서 정의).
    if ($is_from_cf = 0) {
        return 444;
    }

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    # Nginx 자체 liveness — Next 컨테이너 다운돼도 응답해야 하므로 proxy 앞에 둔다.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # service-web 의 lib/api.ts 가 /api/* 로 호출(MSW dev 호환). admin vhost 와 동일 패턴 —
    # 운영에서는 /v1/* 로 rewrite 후 backend api upstream 으로 same-origin 프록시.
    # /creator/* 안에서 발생하는 BE 호출(추후 BFF 도입 전까지는 미동작 가정)도 같이 커버.
    location /api/admin/ {
        proxy_pass http://dotshelf_api/v1/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # DotShelf Launcher → Cloudflare R2 (cdn.dotshelf.digital) 로 이전 (2026-05-11).
    # 기존 0.1.0 런처는 manifest/events URL 이 dotshelf.digital 로 하드코딩 → 301 로 transparent 이전.
    # 런처 소스 URL 을 cdn 으로 갈아끼우고 사용자가 새 .exe 로 교체 완료되면 이 블록 통째로 제거 가능.
    # Cache-Control max-age=300: 301 의 영구 캐시 위험 차단 — rollback 시 5분 내 origin 재확인.
    location ~ ^/launcher/windows/(.+)$ {
        add_header Cache-Control "public, max-age=300" always;
        return 301 https://cdn.dotshelf.digital/windows/$1;
    }

    location /launcher/ {
        add_header Cache-Control "public, max-age=300" always;
        return 301 https://cdn.dotshelf.digital/;
    }

    location / {
        proxy_pass http://dotshelf_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

# dev (test) vhost 는 별도 파일로 분리 — backend/deploy/prod/nginx/conf.d/dev-vhosts.conf
# (dev 트리거 CI 잡 backend:test-deploy / service-web:test-deploy 만 rsync). 이 파일을
# 통째로 prod 에 보내는 master 잡이 dev 변경을 끌고 가지 않게 격리.

# ---------- api -> Spring Boot (upstream dotshelf_api 는 upstream.active.conf 에서 주입) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dotshelf.digital;

    # CF-only origin guard ($is_from_cf 는 00-cf-allowlist.conf 에서 정의).
    if ($is_from_cf = 0) {
        return 444;
    }

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # /actuator/* 는 Prometheus 메트릭·헬스·정보 전부 노출되므로 외부 접근 차단.
    # 내부 Prometheus 는 Tailscale 로 컨테이너(8080/8081) 에 직접 접근하므로 영향 없음.
    # 공개 헬스체크는 /health (HealthController) 를 사용한다.
    location /actuator {
        return 404;
    }

    location / {
        proxy_pass http://dotshelf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

# ---------- grafana -> dotshelf-grafana (docker bridge 172.17.0.1:3000) ----------
# 공개 URL 이지만 Cloudflare Access (Zero Trust) 로 보호.
# - Cloudflare Access 가 grafana.dotshelf.digital 앞단에서 Google OAuth 인증 강제
# - 인증 통과한 요청만 Cloudflare → Nginx origin (이 서버) 로 프록시
# - Nginx origin 은 요청이 인증을 통과했다고 신뢰 (Cf-Access-Jwt-Assertion 헤더 검증은 선택)
# - Grafana 자체 로그인은 그대로 유지 (이중 인증 · 역할별 권한 관리)
#
# Cloudflare Access 미적용 상태에서는 공개 로그인 페이지가 노출되니 반드시 Access 먼저 설정 확인.
# 설정 가이드: docs/infra/2026-04-24-monitoring-stack.md §9
#
# WebSocket upgrade 지원 (Grafana Live · 대시보드 실시간 업데이트).
upstream dotshelf_grafana {
    server 172.17.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.dotshelf.digital;

    # CF-only origin guard ($is_from_cf 는 00-cf-allowlist.conf 에서 정의).
    if ($is_from_cf = 0) {
        return 444;
    }

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Grafana 에 업로드할 대시보드 JSON 등이 10m 넘는 경우 대비
    client_max_body_size 10m;

    location / {
        proxy_pass http://dotshelf_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Grafana Live 는 WebSocket 사용
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }
}

# admin vhost 는 별도 파일로 분리 — backend/deploy/prod/nginx/conf.d/admin-vhost.conf
# (admin-web:deploy 잡만 rsync). admin-web 은 dev=prod 단일 스테이지라 dev 트리거가
# admin vhost 만 갱신하고 다른 prod vhost (api, service-web, grafana) 는 안 건드리도록 격리.

# ---------- unknown host ----------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
