# Blue-Green 의 `upstream dotshelf_api` 는 nginx.conf 의 `include /etc/nginx/conf.d/*.conf`
# 를 통해 upstream.active.conf 에서 자동 로드된다. 여기서 명시 include 하면 중복 선언으로
# `duplicate upstream` 에러가 나므로 절대 쓰지 말 것. (블루그린 런타임 상태는 templates/
# 아래 블루/그린 파일을 배포 스크립트가 cp 해서 upstream.active.conf 로 승격하는 방식.)

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- root + www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dotshelf.digital www.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/root;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------- api -> Spring Boot (upstream dotshelf_api 는 upstream.active.conf 에서 주입) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://dotshelf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

