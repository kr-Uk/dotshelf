# ---------- Blue-Green 스위치 포인트 ----------
# upstream.active.conf 는 배포 스크립트(.ci/deploy-blue-green.sh) 가 upstream.blue.conf 또는
# upstream.green.conf 를 cp 해서 갱신하는 1-파일 토글. 갱신 후 nginx -s reload 로 적용.
# 이 파일은 git 에 체크인하지 않는다 (런타임 상태).
include /etc/nginx/conf.d/upstream.active.conf;

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- root + www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dotshelf.digital www.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/root;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------- api -> Spring Boot (upstream dotshelf_api 는 upstream.active.conf 에서 주입) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://dotshelf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

# ---------- grafana (placeholder) ----------
