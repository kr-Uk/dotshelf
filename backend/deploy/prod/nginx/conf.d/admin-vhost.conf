# admin-web (운영자 백오피스) vhost 전용 설정.
#
# 이 파일은 admin-web:deploy (dev 트리거) 잡만 prod 호스트로 rsync 한다. default.conf
# (prod) / dev-vhosts.conf (test) 와 격리되어, dev 브랜치에서 admin-web 을 수정해도 다른
# prod vhost (api, service-web, grafana) 트래픽은 영향 받지 않는다.
#
# admin-web 만 dev=prod 단일 스테이지 (운영자 백오피스, 변경 빈도 낮음) — dev 브랜치 푸시가
# 즉시 prod 에 반영되는 게 의도된 흐름이다. 다만 영향 범위를 admin vhost 로 한정하기 위해
# 별도 파일로 분리.
#
# nginx 의 conf.d/*.conf include 패턴이라 default.conf 의 real_ip / map / 공통 설정과 같은
# nginx server context 에서 자동 로드된다.

# ---------- admin-web (운영자 백오피스) -> SSAFY:3001 ----------
# Next.js standalone 컨테이너. Tailscale 로 SSAFY app 서버에 접근.
# 도메인 앞단을 Cloudflare Access(Zero Trust, Google OAuth) 로 보호 — Grafana 와 동일 패턴.
# 허용 사용자: jihocompany1705@gmail.com (CF Zero Trust 대시보드에서 Application 정책으로 관리).
# Cf-Access-Jwt-Assertion 헤더 검증은 생략 — Origin Cert + Cloudflare proxied 만으로 충분 가정.
upstream dotshelf_admin {
    server 100.74.2.103:3001;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.dotshelf.digital;

    # CF-only origin guard ($is_from_cf 는 00-cf-allowlist.conf 에서 정의).
    if ($is_from_cf = 0) {
        return 444;
    }

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    # admin-web 의 lib/api.ts 가 /api/admin/* 로 호출. 운영에서는 여기서 /v1/admin/* 로
    # rewrite 해 backend api upstream 으로 프록시 — same-origin 유지(CORS 회피) + dev 코드 그대로.
    location /api/ {
        proxy_pass http://dotshelf_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://dotshelf_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
