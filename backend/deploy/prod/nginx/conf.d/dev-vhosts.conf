# dev (test 환경) vhost 전용 설정.
#
# 이 파일은 dev 트리거 CI 잡 (backend:test-deploy / service-web:test-deploy) 만 prod 호스트로
# rsync 한다. default.conf (prod vhost) / admin-vhost.conf (admin) 와 격리되어, dev 브랜치에서
# 실수로 prod vhost 를 건드려도 prod 트래픽 라우팅이 변경되지 않는다.
#
# nginx 의 conf.d/*.conf include 패턴이라 default.conf 의 real_ip / map / 공통 설정과 같은
# nginx server context 에서 자동 로드된다.
#
# real_ip / WebSocket map 같은 공통 디렉티브는 default.conf 에서 한 번만 선언 — 여기엔 중복
# 금지 (duplicate directive 에러).

# ---------- dev.* test 환경 upstream ----------
# SSAFY 호스트의 test 컨테이너로 직접 라우팅. blue-green 없음 (단일 인스턴스).
upstream dotshelf_api_test {
    server 100.74.2.103:9080;
    keepalive 32;
}

upstream dotshelf_service_test {
    server 100.74.2.103:3102;
    keepalive 32;
}

# ---------- dev-api.dotshelf.digital -> Spring Boot test 컨테이너 ----------
# 외부 노출되는 test 백엔드. prod 의 api 와 동일 라우팅 규칙 (actuator 차단 등).
# 도메인 prefix 가 'dev-api' (대시) 인 이유: Cloudflare Universal SSL wildcard *.dotshelf.digital
# 가 1단계 서브도메인만 커버 → 2단계인 dev.api.* 는 Advanced Certificate Manager (월 $10) 필요.
# 한 단계 서브로 통일해 무료 SSL 만으로 운영.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev-api.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location /actuator {
        return 404;
    }

    location / {
        proxy_pass http://dotshelf_api_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

# ---------- dev.dotshelf.digital -> service-web test 컨테이너 ----------
# 외부 노출되는 test 프론트엔드. /api/* 은 dev-api 의 /v1/* 로 same-origin rewrite
# (admin vhost 와 동일 패턴, 단 backend 만 test 인스턴스로 향함).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.dotshelf.digital;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # service-web 의 lib/api.ts 가 API_BASE="/api" 로 모든 호출을 /api/* 로 만든다
    # (/api/auth/login, /api/books, /api/admin/*, ...). 이걸 전부 test backend 의 /v1/* 로
    # rewrite 한다 — admin vhost (admin.dotshelf.digital) 의 /api/ → /v1/ 패턴과 동일.
    # prod 의 dotshelf.digital vhost 는 현재 /api/admin/ 만 프록시하는데 (이번 PR 범위 밖),
    # 그것도 같은 결함이 있어 별도 follow-up 에서 정리 예정.
    location /api/ {
        proxy_pass http://dotshelf_api_test/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://dotshelf_service_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
