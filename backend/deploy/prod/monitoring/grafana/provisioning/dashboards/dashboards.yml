# Grafana dashboard provisioning.
# /etc/grafana/provisioning/dashboards/ 아래 JSON 을 자동 로드.
apiVersion: 1

providers:
  - name: 'DotShelf'
    orgId: 1
    folder: 'DotShelf'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
