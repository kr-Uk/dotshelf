# Test 환경 (단일 컨테이너).
#
# 운영(prod) 의 docker-compose.yml 과 독립 — SSAFY 호스트 위에 prod blue/green 과 함께 띄운다.
#
# 토폴로지:
#   - api-test 컨테이너         (포트 9080, Tailscale IP 에 바인딩) → dev-api.dotshelf.digital
#   - service-web-test 컨테이너 (포트 3102, Tailscale IP 에 바인딩) → dev.dotshelf.digital
# (도메인 prefix 가 'dev-api' (대시) 인 이유: Cloudflare Universal SSL wildcard 가 1단계 서브
#  도메인만 커버. 두 단계 dev.api.* 는 추가 결제 필요해서 단순화함.)
#   - DB / Redis: dotshelf-prod 서버의 기존 PostgreSQL / Redis 를 그대로 사용
#       * DB:    dotshelf_test (별도 database, prod 와 동일 instance)
#       * Redis: prod 와 동일 instance, database index = 1 (prod=0)
#   - OAuth 는 더미 ENV — 소셜 로그인 콜백 미테스트
#   - JWT_SECRET 은 prod 와 다른 값 (토큰 cross-validity 차단)
#
# 사전 조건 (서버에서 다음을 미리 준비해야 한다):
#   $EC2_DEPLOY_PATH/api-test/Dockerfile             ← backend/Dockerfile 과 동일 사본
#   $EC2_DEPLOY_PATH/api-test/build/libs/*.jar       ← dev 브랜치 bootJar 산출물
#   $EC2_DEPLOY_PATH/service-web-test/Dockerfile     ← web/service-web/Dockerfile 사본
#   $EC2_DEPLOY_PATH/service-web-test/(Next 소스)    ← dev 브랜치 service-web 소스 rsync
#   $EC2_DEPLOY_PATH/.env.test                       ← .env.test.example 참고 (현재는 api-test 만 참조)
#
# 위 staging 은 현재 단계에서는 수동 (scp) — 차후 .gitlab-ci.yml 에 backend:test-deploy 잡이
# 추가되면 자동화된다 (dev 브랜치 트리거).
#
# 사용:
#   docker compose -f docker-compose.test.yml --env-file .env.test up -d --build api-test service-web-test
#   docker compose -f docker-compose.test.yml --env-file .env.test logs -f api-test
#   docker compose -f docker-compose.test.yml --env-file .env.test down
#
# Promtail (prod compose 의 dotshelf-promtail) 이 dotshelf-api-test 컨테이너 로그도 수집하도록
# promtail-config.yml 의 docker_sd filters / color relabel 정규식을 같이 갱신한다.
services:
  api-test:
    build:
      context: ./api-test
      dockerfile: Dockerfile
    image: dotshelf/api:test
    container_name: dotshelf-api-test
    restart: unless-stopped
    extra_hosts:
      - "dotshelf-prod:100.86.247.88"
    ports:
      - "100.74.2.103:9080:8080"
    mem_limit: 2g
    environment:
      DEPLOY_COLOR: test
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_DATABASE: ${SPRING_DATA_REDIS_DATABASE:-1}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1800}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      GOOGLE_SERVER_CLIENT_ID: ${GOOGLE_SERVER_CLIENT_ID:-dummy.apps.googleusercontent.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-secret}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-dummy.apps.googleusercontent.com}
      # Desktop OAuth PKCE 흐름 (MR #90) — Desktop client_id가 FE authorize 시 사용한 값과
      # 정확히 일치해야 Google이 code 교환 허용. 미설정 시 BE가 명시적 INVALID_TOKEN throw.
      GOOGLE_DESKTOP_CLIENT_ID: ${GOOGLE_DESKTOP_CLIENT_ID:-}
      # Google Desktop app type client의 secret. 형식적으로 token endpoint가 요구
      # (binary에 박힌 공개 secret, 진짜 보안은 PKCE).
      GOOGLE_DESKTOP_CLIENT_SECRET: ${GOOGLE_DESKTOP_CLIENT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-dummy}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-dummy}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:18080/oauth/kakao/callback}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-dummy}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-dummy}
      # S3 업로드 — dev/test 는 prod 와 달리 bucket 미설정 시 placeholder 로 fallback.
      # placeholder-not-real 은 부팅(@NotBlank) 만 통과시키는 값이고 실제 PUT/GET 시
      # NoSuchBucket 가 떨어진다. 진짜 검증은 .env.test 에 S3_BUCKET 을 채우거나
      # LocalStack endpoint(S3_ENDPOINT) 를 도입한 후 가능 — 이번 단계에선 테스트 부팅만 보장.
      S3_BUCKET: ${S3_BUCKET:-placeholder-not-real}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-300}
      S3_PRESIGN_BUNDLE_TTL: ${S3_PRESIGN_BUNDLE_TTL:-1800}
      TZ: Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # service-web-test: dev.dotshelf.digital 의 백엔드. prod service-web 과 동일 이미지 빌드,
  # 단지 prod Nginx 가 /api/admin/ 을 dev.api 로 라우팅한다는 차이만 있다.
  # NEXT_PUBLIC_USE_MOCKS 는 prod 와 동일하게 미설정(=false). 실제 test backend 호출.
  service-web-test:
    build:
      context: ./service-web-test
      dockerfile: Dockerfile
    image: dotshelf/service-web:test
    container_name: dotshelf-service-web-test
    restart: unless-stopped
    ports:
      - "100.74.2.103:3102:3000"
    mem_limit: 512m
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
