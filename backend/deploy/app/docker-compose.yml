services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: dotshelf/api:latest
    container_name: dotshelf-api
    restart: unless-stopped
    extra_hosts:
      - "dotshelf-prod:100.86.247.88"
    ports:
      - "100.74.2.103:8080:8080"
    # 호스트 RAM 15 GiB 중 JVM 이 MaxRAMPercentage=60 기반으로 heap 을 잡으므로,
    # 컨테이너 메모리 제한이 없으면 heap 이 ~9 GiB 까지 커질 수 있다.
    # blue-green 공존 시 2 x heap > host RAM → OOM. 색당 4 GiB 로 고정.
    mem_limit: 4g
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      GOOGLE_SERVER_CLIENT_ID: ${GOOGLE_SERVER_CLIENT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      TZ: Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
