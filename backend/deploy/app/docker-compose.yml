services:
  # Blue-Green 무중단 배포용 2-color 컨테이너.
  # - 색당 포트: blue=8080, green=8081 (Tailscale IP 에 바인딩)
  # - 어느 색이 트래픽을 받는지는 prod Nginx upstream.active.conf 로 결정
  # - deploy-blue-green.sh 가 두 색 중 idle 쪽만 재시작하고 Nginx 스위칭 후 구 color stop
  # - mem_limit=4g: JVM 2개 공존 시 호스트 15 GiB 중 8 GiB 점유로 OOM 방지 (MaxRAMPercentage=60 기준 heap ~2.4 GiB)
  api-blue:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: dotshelf/api:latest
    container_name: dotshelf-api-blue
    restart: unless-stopped
    extra_hosts:
      - "dotshelf-prod:100.86.247.88"
    ports:
      - "100.74.2.103:8080:8080"
    mem_limit: 4g
    environment:
      DEPLOY_COLOR: blue
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      TZ: Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-green:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: dotshelf/api:latest
    container_name: dotshelf-api-green
    restart: unless-stopped
    extra_hosts:
      - "dotshelf-prod:100.86.247.88"
    ports:
      - "100.74.2.103:8081:8080"
    mem_limit: 4g
    environment:
      DEPLOY_COLOR: green
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      TZ: Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
