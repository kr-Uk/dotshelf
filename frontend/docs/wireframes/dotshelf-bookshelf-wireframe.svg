  <rect class="bg" x="0" y="0" width="1800" height="1260"/>
  <text class="title" x="64" y="58">dotshelf 책장 쪽 와이어프레임</text>
  <text class="body" x="64" y="88">PC / 태블릿 우선. 벽면2 정면뷰, 책 드래그 gap preview, 책 포커싱 뷰를 기준으로 구성.</text>

  <rect class="board" x="64" y="120" width="1060" height="660" rx="10"/>
  <text class="h2" x="92" y="158">A. 벽면2 정면뷰 - 기본 책장 탐색</text>
  <text class="small" x="92" y="182">카메라: 책장 정면 중앙, FOV 45도, 줌/팬은 정면뷰에서만 활성</text>

  <rect class="panel" x="92" y="205" width="1004" height="50" rx="8"/>
  <text class="h3" x="118" y="236">내 서재 / 벽면2</text>
  <rect class="button" x="822" y="218" width="106" height="24" rx="6"/>
  <text class="label" x="844" y="235">방 전체</text>
  <rect class="button" x="942" y="218" width="64" height="24" rx="6"/>
