  <rect class="section" x="718" y="565" width="104" height="88" rx="3"/>
  <text class="small" x="541" y="702">4행 x 4열 섹션. 내부 처리는 shelfId / row / col / slotIndex 기준.</text>

  <rect class="bookA" x="360" y="322" width="12" height="48" rx="2"/>
