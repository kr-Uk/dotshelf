  <rect class="button" x="848" y="448" width="34" height="64" rx="16"/>
  <text class="h2" x="861" y="488">›</text>

  <rect class="panel" x="902" y="274" width="170" height="430" rx="8"/>
  <text class="h3" x="926" y="306">섹션 액션</text>
  <text class="small" x="926" y="334">빈 영역 탭</text>
  <rect class="button" x="926" y="354" width="36" height="28" rx="6"/>
  <text class="label" x="938" y="373">좌</text>
  <rect class="button" x="968" y="354" width="36" height="28" rx="6"/>
  <text class="label" x="980" y="373">중</text>
  <rect class="button" x="1010" y="354" width="36" height="28" rx="6"/>
  <text class="label" x="1022" y="373">우</text>
  <line class="line" x1="926" y1="408" x2="1046" y2="408"/>
  <text class="small" x="926" y="436">책 탭</text>
  <text class="small" x="926" y="458">→ 책 포커싱 뷰</text>
  <text class="small" x="926" y="492">책 드래그</text>
  <text class="small" x="926" y="514">→ 슬롯 preview</text>
  <text class="small" x="926" y="548">휠/핀치</text>
  <text class="small" x="926" y="570">→ 줌 0.8m~4.5m</text>
  <text class="small" x="926" y="604">빈 공간 드래그</text>
  <text class="small" x="926" y="626">→ 팬 이동</text>

  <rect class="board" x="1160" y="120" width="576" height="660" rx="10"/>
  <text class="h2" x="1188" y="158">B. 드래그 + gap preview</text>
  <text class="small" x="1188" y="182">preview는 화면 상태만 변경. Domain 데이터는 drop commit 순간에만 변경.</text>
  <rect class="shelf" x="1228" y="240" width="390" height="292" rx="6"/>
  <rect class="section" x="1250" y="262" width="78" height="56" rx="3"/>
  <rect class="section" x="1336" y="262" width="78" height="56" rx="3"/>
