  <rect class="section" x="1508" y="326" width="88" height="56" rx="3"/>
  <rect class="section" x="1250" y="390" width="78" height="56" rx="3"/>
  <rect class="section" x="1336" y="390" width="78" height="56" rx="3"/>
  <rect class="section" x="1422" y="390" width="78" height="56" rx="3"/>
  <rect class="section" x="1508" y="390" width="88" height="56" rx="3"/>
  <rect class="section" x="1250" y="454" width="78" height="56" rx="3"/>
  <rect class="section" x="1336" y="454" width="78" height="56" rx="3"/>
  <rect class="section" x="1422" y="454" width="78" height="56" rx="3"/>
  <rect class="section" x="1508" y="454" width="88" height="56" rx="3"/>

  <rect class="bookA" x="1438" y="338" width="10" height="34" rx="2"/>
  <rect class="ghost" x="1455" y="334" width="15" height="40" rx="2"/>
  <rect class="bookC" x="1478" y="338" width="10" height="34" rx="2"/>
  <rect class="bookD" x="1493" y="340" width="9" height="32" rx="2"/>
  <text class="small" x="1430" y="407">insertIndex = 1</text>

  <rect class="bookB" x="1370" y="188" width="28" height="80" rx="5"/>
  <path class="dash" d="M1384 270 C1392 300 1408 318 1458 334"/>
  <text class="small" x="1328" y="176">드래그 중인 실제 책</text>

  <rect class="invalid" x="1642" y="240" width="54" height="292" rx="8"/>
  <text class="small" transform="translate(1677 342) rotate(90)">경계 0.6초 유지 → 다음 책장</text>
  <circle cx="1668" cy="220" r="22" fill="#ffffff" stroke="#2f6f8f" stroke-width="4"/>
  <path d="M1668 198 A22 22 0 0 1 1690 220" fill="none" stroke="#8fd694" stroke-width="5"/>
  <text class="h2" x="1659" y="229">›</text>

  <rect class="panel" x="1188" y="564" width="516" height="158" rx="8"/>
  <text class="h3" x="1214" y="596">상태 규칙</text>
  <text class="body" x="1214" y="624">Idle → Pressed → Dragging → Preview</text>
  <text class="body" x="1214" y="650">Preview → CrossShelfPending → CrossShelfTransition → Preview</text>
  <text class="body" x="1214" y="676">Drop 유효: Dropping → Idle / 무효: Returning → Idle</text>
  <text class="body" x="1214" y="702">DragAnchor는 월드 고정. 책장은 턴테이블로만 회전.</text>

  <rect class="board" x="64" y="820" width="1060" height="360" rx="10"/>
  <text class="h2" x="92" y="858">C. 책 포커싱 뷰</text>
  <text class="small" x="92" y="882">책 탭 시 책이 전면으로 이동하고, 표지가 보이도록 회전. 편집 권한은 MY_ROOM / VISITOR_MODE로 분기.</text>
  <rect class="panel" x="102" y="918" width="392" height="210" rx="8"/>
  <rect class="bookD" x="245" y="950" width="84" height="134" rx="8"/>
  <text class="label" x="235" y="1112">포커싱된 책</text>
  <rect class="panel" x="530" y="918" width="538" height="210" rx="8"/>
  <text class="h3" x="558" y="952">책 상세 패널</text>
  <rect class="soft" x="558" y="972" width="110" height="130" rx="6"/>
  <text class="small" x="585" y="1042">표지</text>
  <text class="body" x="690" y="982">제목 / 저자 / 출판사</text>
  <line class="line" x1="690" y1="998" x2="1018" y2="998"/>
  <rect class="button" x="690" y="1018" width="70" height="26" rx="6"/>
  <text class="label" x="709" y="1036">읽음</text>
  <rect class="button" x="770" y="1018" width="92" height="26" rx="6"/>
  <text class="label" x="789" y="1036">읽는 중</text>
  <rect class="button" x="872" y="1018" width="86" height="26" rx="6"/>
  <text class="label" x="892" y="1036">안 읽음</text>
  <text class="small" x="690" y="1072">평점, 한줄평, 공개/비공개, 독후감 진입</text>
  <rect class="button" x="690" y="1086" width="132" height="26" rx="6"/>
  <text class="label" x="718" y="1104">독후감 작성</text>
  <rect class="button" x="936" y="1086" width="82" height="26" rx="6"/>
  <text class="label" x="961" y="1104">뒤로</text>

  <rect class="board" x="1160" y="820" width="576" height="360" rx="10"/>
  <text class="h2" x="1188" y="858">D. 구현 메모</text>
  <text class="body" x="1188" y="902">1. 책장 배치는 slot 기반: shelfId, sectionRow, sectionCol, slotIndex.</text>
  <text class="body" x="1188" y="934">2. preview 중에는 Transform과 ghost만 변경한다.</text>
  <text class="body" x="1188" y="966">3. commit 전 API 저장이나 Domain placement 변경은 금지.</text>
  <text class="body" x="1188" y="998">4. Mock API와 Real API는 base URL만 다르게 유지한다.</text>
  <text class="body" x="1188" y="1030">5. 방문자는 책 구경과 공개 독후감 열람 중심, 편집 UI는 숨긴다.</text>
  <text class="body" x="1188" y="1062">6. 마지막 책장 삭제는 막고 최소 1개를 유지한다.</text>
  <text class="body" x="1188" y="1094">7. 좌우 경계 cross-shelf는 Pending progress로 예고한다.</text>
  <text class="body" x="1188" y="1126">8. 쿼터뷰는 진입점, 책장 세부 조작은 벽면2 정면뷰에서 처리한다.</text>
</svg>
