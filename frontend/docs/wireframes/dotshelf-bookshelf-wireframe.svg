      .small { font: 400 12px "Pretendard", "Noto Sans KR", Arial, sans-serif; fill: #5f554d; }
      .label { font: 700 12px "Pretendard", "Noto Sans KR", Arial, sans-serif; fill: #3b352f; }
      .button { fill: #ffffff; stroke: #746a60; stroke-width: 1.5; }
      .chip { fill: #ece2d4; stroke: #9b9185; stroke-width: 1; }
      .line { stroke: #746a60; stroke-width: 1.5; fill: none; }
      .dash { stroke: #746a60; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
